name: cuda_test

on: workflow_call

permissions:
  contents: read

jobs:
  cuda_test:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'hwdsl2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/workflows/tests
      - name: Test CUDA image boot without GPU
        run: |
          [ ! -x /usr/bin/docker ] && exit 1

          cd "$GITHUB_WORKSPACE"
          pwd

          set -x

          docker build \
            -f Dockerfile.cuda \
            --build-arg BUILD_DATE=ci-test \
            --build-arg VERSION=cuda \
            -t whisper-cuda-test \
            .

          docker run \
            --name whisper-cuda-runtime-test \
            --restart=always \
            --cpus=2 \
            -e WHISPER_DISABLE_USAGE_COUNTS=1 \
            -v whisper-cuda-runtime-test-data:/var/lib/whisper \
            -e WHISPER_MODEL=tiny \
            -e WHISPER_DEVICE=cpu \
            -e WHISPER_API_KEY=test-whisper-cuda-key \
            -e WHISPER_CONDITION_ON_PREVIOUS_TEXT=false \
            -e WHISPER_NO_REPEAT_NGRAM_SIZE=3 \
            -e WHISPER_DIARIZATION=true \
            -e WHISPER_DIARIZE_THREADS=1 \
            -p 9000:9000/tcp \
            -d whisper-cuda-test

          # Wait for server to be ready (up to 300 seconds for model download)
          i=0
          while [ "$i" -lt 300 ]; do
            if docker exec whisper-cuda-runtime-test curl -sf http://127.0.0.1:9000/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
            i=$((i + 1))
          done

          docker ps | grep whisper-cuda-runtime-test
          docker logs whisper-cuda-runtime-test

          # Verify the CUDA image can boot on a non-GPU runner in explicit CPU mode.
          docker logs whisper-cuda-runtime-test 2>&1 | grep -Eq 'Device:[[:space:]]+cpu'
          docker logs whisper-cuda-runtime-test 2>&1 | grep -q 'condition_on_previous_text=False no_repeat_ngram_size=3'
          docker logs whisper-cuda-runtime-test 2>&1 | grep 'Diarization enabled (num_threads=1 per model) on cpu.' >/dev/null

          # Verify health, auth enforcement, and the OpenAI-compatible models endpoint.
          docker exec whisper-cuda-runtime-test curl -sf http://127.0.0.1:9000/health

          http_code=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:9000/v1/models 2>/dev/null || true)
          [ "$http_code" = "401" ] || { echo "Expected 401 without key, got $http_code"; exit 1; }

          curl -sf http://127.0.0.1:9000/v1/models \
            -H "Authorization: Bearer test-whisper-cuda-key" \
            | grep -q '"object"'

          docker exec whisper-cuda-runtime-test whisper_manage --showinfo
          docker exec whisper-cuda-runtime-test whisper_manage --listmodels
          docker exec whisper-cuda-runtime-test python3 -c 'import faster_whisper; print("faster-whisper import ok")'
          # This verifies argument compatibility on CPU, not GPU inference.
          docker exec whisper-cuda-runtime-test python3 -c \
            'import inspect; from faster_whisper import WhisperModel; p = inspect.signature(WhisperModel.transcribe).parameters; assert {"condition_on_previous_text", "no_repeat_ngram_size"} <= p.keys()'

          # Exercise actual CPU diarization in the CUDA image, not GPU inference.
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 --max-time 60 \
            https://raw.githubusercontent.com/Azure-Samples/cognitive-services-speech-sdk/5886c5b7c528bf036508abfd8b4d449ddab0164a/sampledata/audiofiles/katiesteve.wav \
            -o "$RUNNER_TEMP/whisper-diarization.wav"
          printf '%s  %s\n' d9ab6bdcd8137223386e8a0ac1d0a723f7ed029310111b9c60ef9ed6cedb4828 \
            "$RUNNER_TEMP/whisper-diarization.wav" | sha256sum -c -
          docker cp "$RUNNER_TEMP/whisper-diarization.wav" whisper-cuda-runtime-test:/tmp/test_diarize.wav
          docker cp .github/workflows/tests/check_diarization.py whisper-cuda-runtime-test:/tmp/check_diarization.py
          timeout 900 docker exec whisper-cuda-runtime-test python3 /tmp/check_diarization.py \
            --api /opt/src/api_server.py --audio /tmp/test_diarize.wav \
            --cache /var/lib/whisper --output /tmp/diarization-results.json

          exit 0
      - name: Clear
        if: always()
        run: |
          docker rm -f whisper-cuda-runtime-test || true
          docker volume rm whisper-cuda-runtime-test-data || true
          docker rmi whisper-cuda-test || true
          rm -f "$RUNNER_TEMP/whisper-diarization.wav"
